name: Deploy LeeWay Logistics Transit World to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/transit-world/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/transit-world
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      VITE_LEEWAY_STATIC_PAGES: '1'
      VITE_LEEWAY_WORLD_API_URL: ${{ vars.LEEWAY_WORLD_API_URL }}
      VITE_LEEWAY_VALHALLA_URL: ${{ vars.LEEWAY_VALHALLA_URL }}
      VITE_BASE_PATH: '/LEEWAY-LOGISTICS-/'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: apps/transit-world/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run LeeWay targeted tests
        run: >
          node --test
          ./src/app/application.test.mjs
          ./src/app/operations.placeSearch.test.mjs
          ./src/data/infrastructure.test.mjs
          ./src/data/cctvLod.test.mjs
          ./src/tooling/viteBuild.test.mjs
          ./src/leeway/enterpriseStore.test.mjs
          ./src/leeway/agentLeeTools.test.mjs
          ./src/leeway/onboardingRequirements.test.mjs
          ./src/leeway/logisticsKnowledge.test.mjs
          ./src/leeway/worldApiBridge.test.mjs
          ./src/leeway/routePlannerCore.test.mjs
          ./src/leeway/addressStore.test.mjs
          ./src/leeway/driveMode.test.mjs
          ./src/leeway/fuelAdvisor.test.mjs
          ./src/leeway/peerComms.test.mjs
          ./src/leeway/hazardReportsClient.test.mjs
          ./server/providers/peerSignaling.test.mjs
          ./server/providers/hazardReports.test.mjs
          ./server/deployment/redisState.test.mjs
          ./src/leeway/valhallaRouting.test.mjs
          ./src/leeway/roadsidePlaces.test.mjs
          ./src/leeway/stationPrices.test.mjs
          ./src/leeway/fuelBenchmark.test.mjs
          ./src/leeway/agentRuntime.test.mjs
          ./src/leeway/browserVoiceAdapter.test.mjs
          ./src/layers/weather/publicWms.test.mjs
          ./src/layers/perimeters/source.test.mjs
          ./src/layers/pipelines/source.test.mjs
          ./server/standalone/provider-cors.test.mjs
          ./server/providers/cctv/illinoisGateway.test.mjs
          ./server/providers/cctv/normalizeFreshness.test.mjs
          ./src/layers/cctv/source.pages.test.mjs
          ./src/leeway/truckRoutePolicy.test.mjs
          ./server/providers/leeway-driver-cockpit.test.mjs
          ./src/sources/leewayTransit.test.mjs
          ./server/providers/leeway-transit.test.mjs
          ./src/data/transitFeeds.test.mjs

      - name: Refresh dated EIA regional diesel benchmark
        continue-on-error: true
        run: node scripts/refresh-fuel-benchmark.mjs

      - name: Build Pages site
        run: npm run build

      - name: Normalize Cesium artifact path
        run: |
          if [ -d "dist/LEEWAY-LOGISTICS-/cesium" ]; then
            rm -rf dist/cesium
            mv "dist/LEEWAY-LOGISTICS-/cesium" dist/cesium
            rm -rf "dist/LEEWAY-LOGISTICS-"
          fi

      - name: Add Pages marker
        run: touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/transit-world/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
