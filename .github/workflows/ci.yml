name: Verify LeeWay Logistics

on:
  pull_request:
    paths:
      - 'apps/transit-world/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/transit-world
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      VITE_LEEWAY_STATIC_PAGES: '1'
      VITE_BASE_PATH: '/LEEWAY-LOGISTICS-/'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: apps/transit-world/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify governed map contracts
        run: >
          node --test
          ./src/leeway/nationalCameraCatalog.test.mjs
          ./src/leeway/cctvExperience.test.mjs
          ./src/leeway/productFeatureCatalog.test.mjs
          ./src/leeway/featureCenter.test.mjs
          ./src/leeway/municipalTransitStore.test.mjs
          ./src/leeway/municipalTransitWorkspace.test.mjs
          ./server/providers/cctv/iteris511.test.mjs
          ./server/providers/cctv/nationalRegistry.test.mjs
          ./server/providers/cctv/globalRegistry.test.mjs
          ./src/leeway/productSplit.test.mjs
          ./src/leeway/publicApiConfig.test.mjs
          ./src/leeway/worldApiBridge.test.mjs
          ./src/leeway/truckRoutePolicy.test.mjs
          ./src/data/infrastructure.test.mjs
          ./src/layers/cctv/source.pages.test.mjs

      - name: Build Logistics world
        run: npm run build
